<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="68" y1="42" x2="448" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10173f"/>
      <stop offset="0.5" stop-color="#090f32"/>
      <stop offset="1" stop-color="#050a24"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(278 250) rotate(90) scale(214)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3e35c9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3e35c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="118" y1="160" x2="408" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f66ff"/>
      <stop offset="0.5" stop-color="#6254ff"/>
      <stop offset="1" stop-color="#a653ef"/>
    </linearGradient>
    <linearGradient id="check" x1="170" y1="300" x2="348" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b84ee9"/>
      <stop offset="0.55" stop-color="#8554f6"/>
      <stop offset="1" stop-color="#5b63ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020616" flood-opacity="0.72"/>
    </filter>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)"/>
  <rect x="21" y="21" width="470" height="470" rx="107" fill="none" stroke="#222d64" stroke-width="10"/>
  <circle cx="278" cy="250" r="184" fill="url(#ambient)"/>

  <g transform="translate(256 256) scale(.72) translate(-256 -256)">
    <g filter="url(#shadow)">
      <path
        d="M400 173A166 166 0 1 0 400 339"
        fill="none"
