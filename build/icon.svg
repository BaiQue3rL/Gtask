        stroke-width="92"
        stroke-linecap="butt"
      />
      <path
        d="M400 173A166 166 0 1 0 400 339"
        fill="none"
        stroke="url(#ring)"
        stroke-width="70"
        stroke-linecap="butt"
      />
      <path d="m358 296 80 41-38 73Z" fill="url(#ring)"/>
