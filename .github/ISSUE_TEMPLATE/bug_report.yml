name: 错误报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及你原本预期看到什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gtask 版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 系统与补充信息
      description: Windows 版本、截图或日志。提交前请移除 UID、手机号、Cookie、Token 和本地路径中的个人信息。
