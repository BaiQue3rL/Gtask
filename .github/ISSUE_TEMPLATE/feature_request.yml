name: 功能建议
description: 说明希望解决的实际使用问题
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 希望 Gtask 怎样处理？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充
      description: 可选。可以说明目前的替代做法或提供界面参考。
