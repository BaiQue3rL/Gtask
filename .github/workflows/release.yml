name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        # Electron 42+ downloads its binary on first use instead of during
        # dependency installation. electron-builder consumes this directory.
        run: pnpm exec install-electron --no

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }

      - name: Test
        # SQLite migrations and consistent backups are I/O-heavy on shared
        # Windows runners. Keep a finite limit without inheriting Vitest's
        # workstation-oriented five-second default.
        run: pnpm exec vitest run --testTimeout=15000

      - name: Build portable edition
        run: pnpm package:portable

      - name: Verify portable edition
        run: pnpm release:verify

      - name: Build installer edition
        run: pnpm package:installer

      - name: Verify installer edition
        run: pnpm release:verify-installer

      - name: Create checksums
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $files = @(
            "release/Gtask-$version-setup.exe",
            "release/Gtask-$version-portable.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $files = @(
            "release/Gtask-$version-setup.exe"
            "release/Gtask-$version-portable.exe"
            "release/SHA256SUMS.txt"
          )
          gh release view "v$version" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" $files --clobber
            gh release edit "v$version" `
              --title "Gtask $version" `
              --notes-file "docs/release-notes-$version.md"
          } else {
            gh release create "v$version" $files `
              --title "Gtask $version" `
              --notes-file "docs/release-notes-$version.md" `
              --verify-tag
          }

      - name: Publish Gitee mirror release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: l3rui
          GITEE_REPO: Gtask
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) {
            throw "Repository secret GITEE_TOKEN is required for mirrored releases"
          }
          node scripts/publish-gitee-release.mjs
